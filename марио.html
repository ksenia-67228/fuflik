let audioCtx = null;
let soundEnabled = true;
function initAudio() {
  if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){} }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}
document.addEventListener('click', initAudio, { once: true });
document.addEventListener('keydown', initAudio, { once: true });
document.getElementById('muteBtn').addEventListener('click', e => {
  e.stopPropagation();
  soundEnabled = !soundEnabled;
  document.getElementById('muteBtn').textContent = soundEnabled ? '🔊' : '🔇';
});

function playTone(freq, dur, type='square', vol=0.1, start=null, endFreq=null) {
  if (!soundEnabled) return;
  if (!audioCtx) initAudio();
  if (!audioCtx) return;
  const now = start || audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, now);
  if (endFreq) osc.frequency.exponentialRampToValueAtTime(endFreq, now + dur);
  g.gain.setValueAtTime(0.0001, now);
  g.gain.exponentialRampToValueAtTime(vol, now + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
  osc.connect(g); g.connect(audioCtx.destination);
  osc.start(now); osc.stop(now + dur + 0.02);
}
function playNoise(dur=0.2, vol=0.2, filt=800) {
  if (!soundEnabled) return;
  if (!audioCtx) initAudio();
  if (!audioCtx) return;
  const now = audioCtx.currentTime;
  const buf = audioCtx.createBuffer(1, audioCtx.sampleRate * dur, audioCtx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  const src = audioCtx.createBufferSource(); src.buffer = buf;
  const f = audioCtx.createBiquadFilter(); f.type='lowpass';
  f.frequency.setValueAtTime(filt, now);
  f.frequency.exponentialRampToValueAtTime(100, now + dur);
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(vol, now);
  g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
  src.connect(f); f.connect(g); g.connect(audioCtx.destination);
  src.start(now); src.stop(now + dur + 0.02);
}

// ==================== ПАРСЕР ====================
function parseLevel(levelData) {
  const platforms = [];
  const blocks = [];
  const coinsList = [];
  const enemies = [];
  const powerups = [];
  let flag = null;

  for (let row = 0; row < levelData.data.length; row++) {
    const line = levelData.data[row];
    for (let col = 0; col < line.length; col++) {
      const c = line[col];
      const x = col * TILE;
      const y = row * TILE;

      if (c === '#') platforms.push({ x, y, w: TILE, h: TILE, type: 'ground', solid: true });
      else if (c === 'B') blocks.push({ x, y, type: 'brick', solid: true, hit: false });
      else if (c === '?') blocks.push({ x, y, type: 'question', solid: true, hit: false, hasCoin: true });
      else if (c === 'C') coinsList.push({ x: x + TILE/2, y: y + TILE/2, collected: false, anim: 0 });
      else if (c === 'E') enemies.push({ x, y, w: 30, h: 30, vx: -1.5, alive: true, type: 'goomba', stompAnim: 0 });
      else if (c === 'T') enemies.push({ x, y, w: 30, h: 40, vx: -1.2, alive: true, type: 'turtle', stompAnim: 0, shell: false });
      else if (c === 'P') platforms.push({ x, y, w: TILE, h: TILE, type: 'pipe', solid: true });
      else if (c === 'F' || c === 'G') flag = { x, y, w: 16, h: TILE * 5 };
    }
  }

  if (!flag) {
    flag = { x: (levelData.width - 5) * TILE, y: (levelData.height - 6) * TILE, w: 16, h: TILE * 5 };
  }

  const merged = [];
  const used = new Set();
  for (let i = 0; i < platforms.length; i++) {
    if (used.has(i)) continue;
    const p = platforms[i];
    if (p.type === 'ground') {
      let mw = p.w;
      let j = i + 1;
      while (j < platforms.length && platforms[j].type === 'ground' &&
             platforms[j].x === p.x + mw && platforms[j].y === p.y) {
        mw += platforms[j].w;
        used.add(j);
        j++;
      }
      merged.push({ x: p.x, y: p.y, w: mw, h: p.h, type: 'ground', solid: true });
    } else {
      merged.push(p);
    }
  }

  return {
    platforms: merged,
    blocks, coinsList, enemies, powerups, flag,
    width: levelData.width * TILE,
    height: levelData.height * TILE,
    timeLimit: levelData.time,
    theme: levelData.theme || 'day',
    name: levelData.name
  };
}

  world = parseLevel(LEVELS[index]);

  player.x = 100;

  gameState = 'playing';
  particles = [];
  fireballs = [];
  floatingTexts = [];
}

// ==================== ЧАСТИЦЫ ====================
function addParticles(x, y, color, count, gravity=true) {
  for (let i = 0; i < count; i++) {
    particles.push({
      x, y,
      vx: (Math.random() - 0.5) * 8,
      vy: -Math.random() * 6 - 1,
      life: 40, maxLife: 40,
      color, size: 2 + Math.random() * 4, gravity
    });
  }
}

function addText(x, y, text, color) {
  floatingTexts.push({ x, y, text, color, life: 60, maxLife: 60, vy: -1 });
}

function updateParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy;
    if (p.gravity) p.vy += 0.4;
    p.life--;
    if (p.life <= 0) particles.splice(i, 1);
  }
  for (let i = floatingTexts.length - 1; i >= 0; i--) {
    const t = floatingTexts[i];
    t.y += t.vy;
    t.life--;
    if (t.life <= 0) floatingTexts.splice(i, 1);
  }
}

// ==================== УПРАВЛЕНИЕ ====================
let keys = {};

document.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k === 'arrowleft' || k === 'a' || k === 'ф') keys.left = true;
  if (k === 'arrowright' || k === 'd' || k === 'в') keys.right = true;
  if (k === ' ' || k === 'arrowup' || k === 'w' || k === 'ц') {
    if (!keys.jump) keys.jumpPressed = true;
    keys.jump = true;
  }
  if (k === 'shift' || k === 'z' || k === 'я') keys.run = true;
  if (k === 'x' || k === 'ч') {
    if (!keys.firePressed) keys.firePressed = true;
    keys.fire = true;
  }
  if (k === 'r') { if (gameState === 'playing' || gameState === 'gameover') restartLevel(); }
  if (k === 'escape') { if (gameState === 'playing') gameState = 'title'; }
  if ([' ', 'arrowleft', 'arrowright', 'arrowup', 'arrowdown'].includes(k)) e.preventDefault();
});
document.addEventListener('keyup', e => {
  const k = e.key.toLowerCase();
  if (k === 'arrowleft' || k === 'a' || k === 'ф') keys.left = false;
  if (k === 'arrowright' || k === 'd' || k === 'в') keys.right = false;
  if (k === ' ' || k === 'arrowup' || k === 'w' || k === 'ц') {
    keys.jump = false;
    keys.jumpPressed = false;
  }
  if (k === 'shift' || k === 'z' || k === 'я') keys.run = false;
  if (k === 'x' || k === 'ч') { keys.fire = false; keys.firePressed = false; }
});

function bindButton(id, key) {
  const btn = document.getElementById(id);
  ['touchstart','mousedown'].forEach(ev => btn.addEventListener(ev, e => {
    e.preventDefault();
    if (key === 'jump' && !keys.jump) keys.jumpPressed = true;
    keys[key] = true;
  }));
  ['touchend','mouseup','mouseleave','touchcancel'].forEach(ev => btn.addEventListener(ev, e => {
    e.preventDefault();
    if (key === 'jump') keys.jumpPressed = false;
    keys[key] = false;
  }));
}

// ==================== РЕСТАРТ ====================
function restartLevel() { loadLevel(currentLevelIndex); }
function fullRestart() { lives = 3; score = 0; coins = 0; currentLevelIndex = 0; loadLevel(0); }

// ==================== КОЛЛИЗИИ ====================
function rectsOverlap(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x &&
         a.y < b.y + b.h && a.y + a.h > b.y;
}

// ==================== ОБНОВЛЕНИЕ ====================
function update() {
  if (gameState === 'title') {
    timer++;
    if (keys.jumpPressed) {
      keys.jumpPressed = false;
      gameState = 'levelselect';
      sfx.levelSelect();
    }
    updateParticles();
    return;
  }

  if (gameState === 'levelselect') {
    timer++;
    if (keys.jumpPressed) {
      keys.jumpPressed = false;
      lives = 3; score = 0; coins = 0;
      loadLevel(currentLevelIndex);
      sfx.levelSelect();
      return;
    }
    if (keys.right && !keys._rightPrev) {
      currentLevelIndex = (currentLevelIndex + 1) % LEVELS.length;
      sfx.levelSelect();
    }
    if (keys.left && !keys._leftPrev) {
      currentLevelIndex = (currentLevelIndex - 1 + LEVELS.length) % LEVELS.length;
      sfx.levelSelect();
    }
    keys._rightPrev = keys.right;
    keys._leftPrev = keys.left;
    updateParticles();
    return;
  }

  if (gameState === 'levelcomplete') {
    timer++;
    if (timer > 150) {
      if (currentLevelIndex + 1 < LEVELS.length) {
        currentLevelIndex++;
        loadLevel(currentLevelIndex);
      } else {
        gameState = 'gameover';
      }
    }
    updateParticles();
    return;
  }

  if (gameState === 'gameover') {
    timer++;
    if (keys.jumpPressed) {
      keys.jumpPressed = false;
      keys.jump = false;
      gameState = 'title';
      timer = 0;
    }
    updateParticles();
    return;
  }

  if (gameState === 'dead') {
    player.vy += GRAVITY;
    player.y += player.vy;
    updateParticles();
    if (player.y > world.height + 300) {
      if (lives > 0) loadLevel(currentLevelIndex);
      else { gameState = 'gameover'; sfx.gameover(); }
    }
    return;
  }

  // === ИГРА ===
  timer++;
  levelTime--;
  if (levelTime <= 0) { playerDie(); return; }

  // === ДВИЖЕНИЕ ===
  const speed = keys.run ? RUN_SPEED : WALK_SPEED;

  if (keys.left) { player.vx = -speed; player.facing = -1; }
  else if (keys.right) { player.vx = speed; player.facing = 1; }
  else { player.vx *= 0.75; if (Math.abs(player.vx) < 0.1) player.vx = 0; }

  // === ПРЫЖОК (сбалансированный) ===
  // Coyote time — короткое окно после схода с платформы
  if (player.onGround) {
    player.coyoteTimer = COYOTE_FRAMES;
  } else if (player.coyoteTimer > 0) {
    player.coyoteTimer--;
  }

  // Jump buffer — короткое окно до приземления
  if (keys.jumpPressed) {
    player.jumpBuffer = JUMP_BUFFER_FRAMES;
    keys.jumpPressed = false;
  } else if (player.jumpBuffer > 0) {
    player.jumpBuffer--;
  }

  // Прыжок
  if (player.jumpBuffer > 0 && player.coyoteTimer > 0) {
    player.vy = JUMP_FORCE;
    player.onGround = false;
    player.coyoteTimer = 0;
    player.jumpBuffer = 0;
    sfx.jump();
  }

  // Переменная высота — жёсткая обрезка при отпускании
  if (!keys.jump && player.vy < JUMP_CUT_VELOCITY) {
    player.vy = JUMP_CUT_VELOCITY;
  }

  // Гравитация
  player.vy += GRAVITY;
  if (player.vy > MAX_FALL) player.vy = MAX_FALL;

  // Движение X
  player.x += player.vx;
  if (player.x < 0) { player.x = 0; player.vx = 0; }
  if (player.x + player.w > world.width) player.x = world.width - player.w;

  // Коллизии X
  const allSolid = [...world.platforms.filter(p => p.solid), ...world.blocks.filter(b => b.solid && b.hit !== 'destroyed')];
  for (const p of allSolid) {
    if (rectsOverlap(player, p)) {
      if (player.vx > 0) player.x = p.x - player.w;
      else if (player.vx < 0) player.x = p.x + p.w;
      player.vx = 0;
    }
  }

  // Движение Y
  player.y += player.vy;
  player.onGround = false;
  for (const p of allSolid) {
    if (rectsOverlap(player, p)) {
      if (player.vy > 0) {
        player.y = p.y - player.h;
        player.vy = 0;
        player.onGround = true;
      } else if (player.vy < 0) {
        player.y = p.y + p.h;
        player.vy = 0;
        if (world.blocks.includes(p) && p.hit !== 'destroyed') hitBlock(p);
      }
    }
  }

  // === МОНЕТЫ ===
  for (const c of world.coinsList) {
    if (c.collected) continue;
    c.anim += 0.15;
    const cb = { x: c.x - 12, y: c.y - 12, w: 24, h: 24 };
    if (rectsOverlap(player, cb)) {
      c.collected = true;
      coins++;
      score += 100;
      sfx.coin();
      addParticles(c.x, c.y, '#FFD700', 8);
      addText(c.x, c.y - 20, '+100', '#FFD700');
    }
  }

  // === POWER-UPS ===
  for (let i = world.powerups.length - 1; i >= 0; i--) {
    const pu = world.powerups[i];
    pu.spawned++;
    if (pu.spawned < 30) {
      pu.y -= 1;
    } else {
      pu.vy = Math.min(pu.vy + GRAVITY, MAX_FALL);
      pu.y += pu.vy;
      pu.x += pu.vx || 0;
      for (const p of world.platforms.filter(p => p.solid)) {
        if (pu.y + pu.h > p.y && pu.y < p.y + p.h) {
          if (pu.vx > 0 && pu.x + pu.w > p.x && pu.x < p.x + p.w) { pu.x = p.x - pu.w; pu.vx = -Math.abs(pu.vx); }
          else if (pu.vx < 0 && pu.x < p.x + p.w && pu.x + pu.w > p.x) { pu.x = p.x + p.w; pu.vx = Math.abs(pu.vx); }
        }
      }
      for (const p of world.platforms.filter(p => p.solid)) {
        if (rectsOverlap(pu, p)) {
          if (pu.vy > 0) { pu.y = p.y - pu.h; pu.vy = 0; }
        }
      }
      if (!pu.vx) pu.vx = 1.5;
    }
    if (rectsOverlap(player, pu)) {
      if (pu.kind === 'mushroom') {
        if (!player.isBig) { player.isBig = true; player.h = 60; player.y -= 16; }
      } else if (pu.kind === 'star') {
        player.invincible = 300;
      } else if (pu.kind === 'fireflower') {
        player.hasFireFlower = true;
        if (!player.isBig) { player.isBig = true; player.h = 60; player.y -= 16; }
      }
      score += 1000;
      sfx.powerup();
      addParticles(pu.x + 16, pu.y + 16, '#FFD700', 15);
      addText(pu.x + 16, pu.y - 20, '+1000', '#FFD700');
      world.powerups.splice(i, 1);
      continue;
    }
    if (pu.y > world.height + 100) world.powerups.splice(i, 1);
  }

  // === ОГОНЬ ===
  if (keys.firePressed && player.hasFireFlower) {
    keys.firePressed = false;
    fireballs.push({
      x: player.x + player.w/2, y: player.y + player.h/2,
      vx: player.facing * 8, vy: 0, life: 120, bounces: 0
    });
    sfx.fireball();
  }
  for (let i = fireballs.length - 1; i >= 0; i--) {
    const fb = fireballs[i];
    fb.x += fb.vx;
    fb.vy += GRAVITY;
    fb.y += fb.vy;
    fb.life--;
    for (const p of world.platforms.filter(p => p.solid)) {
      if (rectsOverlap({x: fb.x - 8, y: fb.y - 8, w: 16, h: 16}, p)) {
        if (fb.vy > 0) { fb.y = p.y - 8; fb.vy = -8; fb.bounces++; }
        else { fb.vx = -fb.vx; fb.vy = -4; }
      }
    }
    for (const e of world.enemies) {
      if (e.alive && rectsOverlap({x: fb.x-8, y: fb.y-8, w: 16, h: 16}, e)) {
        e.alive = false;
        e.stompAnim = 0;
        score += 200;
        sfx.stomp();
        addParticles(e.x + 15, e.y + 15, '#E53935', 12);
        fireballs.splice(i, 1);
        break;
      }
    }
    if (fb.x < 0 || fb.x > world.width || fb.life <= 0 || fb.bounces > 3) fireballs.splice(i, 1);
  }

  // === ВРАГИ ===
  for (let i = world.enemies.length - 1; i >= 0; i--) {
    const e = world.enemies[i];
    if (!e.alive) {
      e.stompAnim++;
      if (e.stompAnim > 30) world.enemies.splice(i, 1);
      continue;
    }
    if (Math.abs(e.x - player.x) > 600) continue;

    e.x += e.vx;

    let onGround = false;
    for (const p of world.platforms.filter(p => p.solid)) {
      if (rectsOverlap({x: e.x, y: e.y, w: e.w, h: e.h}, p)) {
        if (e.vx > 0) { e.x = p.x - e.w; e.vx = -e.vx; }
        else { e.x = p.x + p.w; e.vx = -e.vx; }
      }
    }
    e.y += 2;
    for (const p of world.platforms.filter(p => p.solid)) {
      if (rectsOverlap({x: e.x, y: e.y, w: e.w, h: e.h}, p)) {
        if (e.y + e.h - 2 <= p.y + 4) { e.y = p.y - e.h; onGround = true; }
      }
    }
    if (onGround) {
      const checkX = e.vx > 0 ? e.x + e.w + 2 : e.x - 2;
      let floorAhead = false;
      for (const p of world.platforms.filter(p => p.solid)) {
        if (checkX >= p.x && checkX <= p.x + p.w && e.y + e.h + 4 >= p.y && e.y + e.h < p.y + p.h) {
          floorAhead = true; break;
        }
      }
      if (!floorAhead) e.vx = -e.vx;
    }

    if (player.invincible <= 0 && rectsOverlap(player, e)) {
      if (player.vy > 0 && player.y + player.h - player.vy <= e.y + 12) {
        player.vy = -10;
        if (e.type === 'goomba') {
          e.alive = false; e.stompAnim = 0;
          score += 200;
          addText(e.x + 15, e.y - 10, '+200', '#4CAF50');
          sfx.stomp();
          addParticles(e.x + 15, e.y + 15, '#8B4513', 10);
        } else if (e.type === 'turtle') {
          if (!e.shell) {
            e.shell = true;
            e.h = 24; e.y += 16;
            e.vx = 0;
            sfx.kick();
            addText(e.x + 15, e.y - 10, 'ПАНЦИРЬ!', '#2E7D32');
          } else {
            e.vx = player.facing > 0 ? 8 : -8;
            sfx.kick();
          }
          score += 200;
        }
      } else if (!e.shell || e.vx === 0) {
        if (player.isBig) {
          player.isBig = false;
          player.h = 44;
          player.y += 16;
          player.invincible = 120;
          sfx.hurt();
        } else {
          playerDie();
        }
      } else {
        playerDie();
      }
    }
    if (e.y > world.height + 100) world.enemies.splice(i, 1);
  }

  // === ФЛАГ ===
  if (world.flag && rectsOverlap(player, world.flag)) {
    gameState = 'levelcomplete';
    timer = 0;
    score += 5000 + Math.floor(levelTime / 10) * 10;
    sfx.win();
  }

  // Анимация
  if (Math.abs(player.vx) > 0.5) player.walkAnim += 0.3;
  if (player.invincible > 0) player.invincible--;

  // Камера
  const targetCamX = Math.max(0, Math.min(world.width - W, player.x - W / 2));
  cameraX += (targetCamX - cameraX) * 0.12;

  updateParticles();
}

function hitBlock(b) {
  if (b.hit) return;
  b.hit = true;

  if (b.type === 'question') {
    if (b.hasPowerup === 'mushroom') {
      world.powerups.push({ x: b.x, y: b.y - 32, w: 30, h: 30, vy: -6, spawned: 0, vx: 1.5, kind: 'mushroom' });
      sfx.powerupAppear();
    } else {
      coins++;
      score += 200;
      sfx.coin();
      addParticles(b.x + 16, b.y, '#FFD700', 10);
      addText(b.x + 16, b.y - 20, '+200', '#FFD700');
    }
  } else if (b.type === 'brick') {
    b.hit = 'destroyed';
    sfx.brick();
    score += 50;
    addParticles(b.x + 16, b.y + 16, '#C86428', 12);
  }
  player.vy = 2;
}

function playerDie() {
  if (gameState !== 'playing') return;
  gameState = 'dead';
  lives--;
  player.vy = -12;
  sfx.die();
  timer = 0;
}

// ==================== ОТРИСОВКА ====================
const THEMES = {
  day:         { sky: '#5C94FC', hill: '#4CAF50', ground: '#C86428', groundTop: '#4CAF50', brick: '#B5651D' },
  underground: { sky: '#000000', hill: '#1a1a1a', ground: '#4A90D9', groundTop: '#2E6BB5', brick: '#3A6FA5' },
  castle:      { sky: '#1a1a2e', hill: '#2a2a3e', ground: '#4a4a5a', groundTop: '#6a6a7a', brick: '#5a3a3a' },
  night:       { sky: '#0a0a2e', hill: '#1a2a4e', ground: '#3a2a1a', groundTop: '#4a3a2a', brick: '#5a4a3a' },
  final:       { sky: '#3a0a0a', hill: '#4a1a1a', ground: '#2a1a1a', groundTop: '#3a2a2a', brick: '#5a2a2a' }
};

function draw() {
  const theme = world && world.theme ? THEMES[world.theme] : THEMES.day;

  ctx.fillStyle = theme.sky;
  ctx.fillRect(0, 0, W, H);

  if (gameState === 'title') { drawTitle(); return; }
  if (gameState === 'levelselect') { drawLevelSelect(); return; }

  if (world.theme === 'night' || world.theme === 'castle' || world.theme === 'final') {
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    for (let i = 0; i < 50; i++) {
      const sx = (i * 137 - cameraX * 0.1) % (world.width + 100);
      const sy = (i * 73) % 300;
      const twinkle = Math.sin(Date.now() / 500 + i) * 0.5 + 0.5;
      ctx.globalAlpha = twinkle * 0.7;
      ctx.fillRect(sx, sy, 2, 2);
    }
    ctx.globalAlpha = 1;
  }

  if (world.theme === 'day' || world.theme === 'night') {
    for (let i = 0; i < 12; i++) {
      const cx = (i * 400 - cameraX * 0.3) % (world.width + 400) - 100;
      const cy = 60 + (i % 4) * 40;
      drawCloud(cx, cy, world.theme === 'night' ? 'rgba(200,200,255,0.3)' : 'rgba(255,255,255,0.9)');
    }
    ctx.fillStyle = theme.hill;
    for (let i = 0; i < 15; i++) {
      const hx = (i * 500 - cameraX * 0.5) % (world.width + 500) - 200;
      ctx.beginPath();
      ctx.arc(hx, H - 50, 180, Math.PI, 0);
      ctx.fill();
    }
  } else if (world.theme === 'castle' || world.theme === 'final') {
    for (let i = 0; i < 20; i++) {
      const fx = (i * 300 - cameraX * 0.4) % (world.width + 300);
      const fy = 100 + (i % 2) * 150;
      ctx.fillStyle = 'rgba(255,100,0,0.6)';
      ctx.beginPath();
      ctx.arc(fx, fy, 8 + Math.sin(Date.now()/200 + i) * 3, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  ctx.save();
  ctx.translate(-Math.floor(cameraX), 0);

  for (const p of world.platforms) {
    if (p.x + p.w < cameraX - 100 || p.x > cameraX + W + 100) continue;
    drawPlatform(p, theme);
  }

  for (const b of world.blocks) {
    if (b.hit === 'destroyed') continue;
    if (b.x + 32 < cameraX - 50 || b.x > cameraX + W + 50) continue;
    drawBlock(b, theme);
  }

  for (const c of world.coinsList) {
    if (c.collected) continue;
    if (c.x < cameraX - 50 || c.x > cameraX + W + 50) continue;
    drawCoin(c);
  }

  for (const pu of world.powerups) drawPowerup(pu);

  for (const e of world.enemies) {
    if (e.x < cameraX - 100 || e.x > cameraX + W + 100) continue;
    drawEnemy(e);
  }

  for (const fb of fireballs) {
    ctx.fillStyle = '#FF4400';
    ctx.beginPath(); ctx.arc(fb.x, fb.y, 8, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#FFFF00';
    ctx.beginPath(); ctx.arc(fb.x, fb.y, 4, 0, Math.PI * 2); ctx.fill();
  }

  if (world.flag) drawFlag();

  if (gameState !== 'dead' || player.y < world.height + 200) drawPlayer();

  for (const p of particles) {
    ctx.globalAlpha = p.life / p.maxLife;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  for (const t of floatingTexts) {
    ctx.globalAlpha = t.life / t.maxLife;
    ctx.fillStyle = t.color;
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 3;
    ctx.font = 'bold 18px Arial';
    ctx.textAlign = 'center';
    ctx.strokeText(t.text, t.x, t.y);
    ctx.fillText(t.text, t.x, t.y);
  }
  ctx.globalAlpha = 1;

  ctx.restore();

  drawHUD(theme);

  if (gameState === 'levelcomplete') {
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#FFD700';
    ctx.font = 'bold 52px Arial';
    ctx.textAlign = 'center';
    ctx.fillText('🏁 УРОВЕНЬ ПРОЙДЕН!', W/2, H/2 - 60);
    ctx.font = 'bold 28px Arial';
    ctx.fillStyle = '#fff';
    ctx.fillText('Очки: ' + score, W/2, H/2);
    ctx.fillText('Монеты: ' + coins, W/2, H/2 + 40);
    ctx.font = '20px Arial';
    ctx.fillStyle = '#FFD700';
    ctx.fillText('Загрузка следующего уровня...', W/2, H/2 + 100);
  }

  if (gameState === 'gameover') {
    ctx.fillStyle = 'rgba(0,0,0,0.8)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#E53935';
    ctx.font = 'bold 60px Arial';
    ctx.textAlign = 'center';
    ctx.fillText('GAME OVER', W/2, H/2 - 40);
    ctx.fillStyle = '#fff';
    ctx.font = '28px Arial';
    ctx.fillText('Итоговый счёт: ' + score, W/2, H/2 + 30);
    ctx.font = '22px Arial';
    ctx.fillStyle = '#FFD700';
    ctx.fillText('Нажми ПРОБЕЛ для возврата в меню', W/2, H/2 + 90);
  }
}

function drawTitle() {
  const t = Date.now() / 1000;
  ctx.fillStyle = '#5C94FC';
  ctx.fillRect(0, 0, W, H);

  ctx.fillStyle = '#4CAF50';
  for (let i = 0; i < 5; i++) {
    ctx.beginPath();
    ctx.arc(i * 200, H - 50, 180, Math.PI, 0);
    ctx.fill();
  }

  for (let i = 0; i < 6; i++) {
    drawCloud(((i * 200 + t * 30) % (W + 200)) - 100, 80 + (i % 3) * 50, 'rgba(255,255,255,0.9)');
  }

  ctx.save();
  ctx.textAlign = 'center';
  const bounce = Math.sin(t * 3) * 6;

  ctx.fillStyle = '#000';
  ctx.font = 'bold 72px Arial';
  ctx.fillText('SUPER', W/2 + 4, 204 + bounce);
  ctx.fillStyle = '#E53935';
  ctx.fillText('SUPER', W/2, 200 + bounce);

  ctx.fillStyle = '#000';
  ctx.font = 'bold 60px Arial';
  ctx.fillText('PLATFORMER', W/2 + 4, 274 + bounce);
  ctx.fillStyle = '#FFD700';
  ctx.fillText('PLATFORMER', W/2, 270 + bounce);
  ctx.restore();

  ctx.fillStyle = 'rgba(0,0,0,0.7)';
  ctx.beginPath();
  ctx.roundRect(W/2 - 150, 380, 300, 70, 15);
  ctx.fill();
  ctx.fillStyle = '#FFD700';
  ctx.font = 'bold 32px Arial';
  ctx.textAlign = 'center';
  ctx.fillText('▶ ИГРАТЬ', W/2, 425);

  ctx.fillStyle = '#fff';
  ctx.font = '18px Arial';
  ctx.fillText('Нажми ПРОБЕЛ или кликни', W/2, 500);
  ctx.font = '14px Arial';
  ctx.fillStyle = '#ddd';
  ctx.fillText('← → движение  •  ПРОБЕЛ прыжок  •  SHIFT бег  •  X огонь', W/2, 540);
}

function drawLevelSelect() {
  ctx.fillStyle = '#5C94FC';
  ctx.fillRect(0, 0, W, H);

  ctx.fillStyle = '#4CAF50';
  for (let i = 0; i < 5; i++) {
    ctx.beginPath();
    ctx.arc(i * 200, H - 50, 180, Math.PI, 0);
    ctx.fill();
  }

  ctx.fillStyle = '#000';
  ctx.font = 'bold 44px Arial';
  ctx.textAlign = 'center';
  ctx.fillText('ВЫБЕРИ УРОВЕНЬ', W/2, 70);

  ctx.fillStyle = '#FFD700';
  ctx.font = 'bold 60px Arial';
  ctx.fillText('◀', 60, H/2 + 20);
  ctx.fillText('▶', W - 60, H/2 + 20);

  const cardW = 500, cardH = 280;
  const cx = W/2 - cardW/2, cy = 140;

  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.beginPath(); ctx.roundRect(cx + 8, cy + 8, cardW, cardH, 20); ctx.fill();

  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.roundRect(cx, cy, cardW, cardH, 20); ctx.fill();

  ctx.strokeStyle = '#FFD700';
  ctx.lineWidth = 5;
  ctx.beginPath(); ctx.roundRect(cx, cy, cardW, cardH, 20); ctx.stroke();

  const lvl = LEVELS[currentLevelIndex];
  const theme = THEMES[lvl.theme];
  ctx.fillStyle = theme.sky;
  ctx.beginPath(); ctx.roundRect(cx + 10, cy + 10, cardW - 20, 80, 12); ctx.fill();

  const icons = { day: '☀️', underground: '🌑', castle: '🏰', night: '🌙', final: '🔥' };
  ctx.font = '50px Arial';
  ctx.textAlign = 'center';
  ctx.fillText(icons[lvl.theme] || '🍄', cx + cardW/2, cy + 68);

  ctx.fillStyle = '#2c3e50';
  ctx.font = 'bold 32px Arial';
  ctx.fillText(lvl.name, cx + cardW/2, cy + 140);

  ctx.font = '20px Arial';
  ctx.fillStyle = '#7f8c8d';
  ctx.fillText('Длина: ' + lvl.width + ' тайлов  •  Время: ' + lvl.time + ' сек', cx + cardW/2, cy + 190);

  for (let i = 0; i < LEVELS.length; i++) {
    ctx.fillStyle = i === currentLevelIndex ? '#E53935' : '#bdc3c7';
    ctx.beginPath();
    ctx.arc(cx + cardW/2 - (LEVELS.length-1)*15 + i*30, cy + 235, 8, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.fillStyle = '#000';
  ctx.font = 'bold 20px Arial';
  ctx.fillText('ПРОБЕЛ / клик — начать', W/2, cy + cardH + 60);
  ctx.font = '16px Arial';
  ctx.fillStyle = '#555';
  ctx.fillText('← → сменить уровень', W/2, cy + cardH + 90);
}

function drawCloud(x, y, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(x, y, 22, 0, Math.PI * 2);
  ctx.arc(x + 22, y - 8, 28, 0, Math.PI * 2);
  ctx.arc(x + 48, y, 22, 0, Math.PI * 2);
  ctx.arc(x + 24, y + 8, 20, 0, Math.PI * 2);
  ctx.fill();
}

function drawPlatform(p, theme) {
  if (p.type === 'ground') {
    ctx.fillStyle = theme.ground;
    ctx.fillRect(p.x, p.y, p.w, p.h);
    ctx.fillStyle = theme.groundTop;
    ctx.fillRect(p.x, p.y, p.w, 6);

    if (world.theme === 'day' || world.theme === 'night') {
      ctx.fillStyle = world.theme === 'night' ? '#2a2a1a' : '#A0522D';
    } else if (world.theme === 'underground') {
      ctx.fillStyle = '#2E5F9A';
    } else {
      ctx.fillStyle = '#3a3a4a';
    }
    for (let x = p.x + 8; x < p.x + p.w; x += 24) {
      for (let y = p.y + 12; y < p.y + p.h; y += 24) {
        ctx.fillRect(x, y, 16, 16);
      }
    }
  } else if (p.type === 'pipe') {
    ctx.fillStyle = '#00A800';
    ctx.fillRect(p.x, p.y, p.w, p.h);
    ctx.fillStyle = '#00D800';
    ctx.fillRect(p.x + 4, p.y, 8, p.h);
    ctx.strokeStyle = '#005500';
    ctx.lineWidth = 2;
    ctx.strokeRect(p.x, p.y, p.w, p.h);
  } else if (p.type === 'brick') {
    ctx.fillStyle = theme.brick;
    ctx.fillRect(p.x, p.y, p.w, p.h);
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 2;
    ctx.strokeRect(p.x, p.y, p.w, p.h);
  }
}

function drawBlock(b, theme) {
  if (b.type === 'question') {
    if (b.hit) ctx.fillStyle = '#7a5a10';
    else {
      const pulse = 0.5 + Math.sin(Date.now() / 200) * 0.3;
      ctx.fillStyle = `rgb(${200 + pulse * 55}, ${160 + pulse * 55}, ${20 + pulse * 30})`;
    }
    ctx.fillRect(b.x, b.y, 32, 32);
    ctx.strokeStyle = '#7a5a10';
    ctx.lineWidth = 2;
    ctx.strokeRect(b.x, b.y, 32, 32);
    ctx.strokeRect(b.x + 2, b.y + 2, 28, 28);
    if (!b.hit) {
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 24px Arial';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('?', b.x + 16, b.y + 18);
    }
  } else if (b.type === 'brick') {
    ctx.fillStyle = theme.brick;
    ctx.fillRect(b.x, b.y, 32, 32);
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 2;
    ctx.strokeRect(b.x, b.y, 32, 32);
    ctx.beginPath();
    ctx.moveTo(b.x, b.y + 16); ctx.lineTo(b.x + 32, b.y + 16);
    ctx.moveTo(b.x + 16, b.y); ctx.lineTo(b.x + 16, b.y + 16);
    ctx.moveTo(b.x + 8, b.y + 16); ctx.lineTo(b.x + 8, b.y + 32);
    ctx.moveTo(b.x + 24, b.y + 16); ctx.lineTo(b.x + 24, b.y + 32);
    ctx.stroke();
  }
}

function drawCoin(c) {
  const wobble = Math.sin(c.anim) * 8;
  const x = c.x + wobble;
  const y = c.y;
  ctx.fillStyle = '#FFD700';
  ctx.beginPath();
  ctx.ellipse(x, y, Math.abs(10 * Math.cos(c.anim)), 14, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#FFA500';
  ctx.beginPath();
  ctx.ellipse(x, y, Math.abs(6 * Math.cos(c.anim)), 10, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#B8860B';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.ellipse(x, y, Math.abs(10 * Math.cos(c.anim)), 14, 0, 0, Math.PI * 2);
  ctx.stroke();
}

function drawEnemy(e) {
  const x = e.x, y = e.y, w = e.w, h = e.h;
  if (!e.alive) {
    ctx.fillStyle = '#8B4513';
    ctx.fillRect(x, y + h - 8, w, 8);
    return;
  }
  if (e.type === 'goomba') {
    ctx.fillStyle = '#8B4513';
    ctx.beginPath();
    ctx.ellipse(x + w/2, y + h/2, w/2, h/2, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#5C2E0E';
    ctx.fillRect(x, y + h - 6, w/3, 6);
    ctx.fillRect(x + w*2/3, y + h - 6, w/3, 6);
    ctx.fillStyle = '#fff';
    ctx.fillRect(x + 6, y + 8, 7, 9);
    ctx.fillRect(x + w - 13, y + 8, 7, 9);
    ctx.fillStyle = '#000';
    const lx = e.vx > 0 ? 2 : 0;
    ctx.fillRect(x + 7 + lx, y + 10, 4, 5);
    ctx.fillRect(x + w - 12 + lx, y + 10, 4, 5);
    ctx.fillRect(x + 5, y + 5, 9, 3);
    ctx.fillRect(x + w - 14, y + 5, 9, 3);
  } else if (e.type === 'turtle') {
    if (e.shell) {
      ctx.fillStyle = '#2E7D32';
      ctx.beginPath();
      ctx.ellipse(x + w/2, y + h/2, w/2, h/2, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#1B5E20';
      ctx.lineWidth = 3;
      ctx.stroke();
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(x + w/2, y + h/2, w/4, 0, Math.PI * 2);
      ctx.stroke();
    } else {
      ctx.fillStyle = '#FFEB3B';
      ctx.beginPath();
      ctx.ellipse(x + w/2, y + h*0.6, w*0.3, h*0.4, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(x + w/2 + e.vx*2, y + 10, 10, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#000';
      ctx.fillRect(x + w/2 + e.vx*2 - 6, y + 8, 3, 3);
      ctx.fillRect(x + w/2 + e.vx*2 + 3, y + 8, 3, 3);
      ctx.fillStyle = '#2E7D32';
      ctx.beginPath();
      ctx.ellipse(x + w/2, y + h*0.55, w*0.45, h*0.35, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#1B5E20';
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.fillStyle = '#FFEB3B';
      const legOff = Math.sin(Date.now() / 100) * 2;
      ctx.fillRect(x + 4, y + h - 8 + legOff, 8, 8);
      ctx.fillRect(x + w - 12, y + h - 8 - legOff, 8, 8);
    }
  }
}

function drawPowerup(pu) {
  const x = pu.x, y = pu.y, w = pu.w, h = pu.h;
  if (pu.kind === 'mushroom') {
    ctx.fillStyle = '#E53935';
    ctx.beginPath();
    ctx.arc(x + w/2, y + h*0.4, w/2, Math.PI, 0);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(x + 8, y + 8, 4, 0, Math.PI*2);
    ctx.arc(x + 22, y + 12, 3, 0, Math.PI*2);
    ctx.arc(x + 15, y + 4, 3, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#FFE0B2';
    ctx.fillRect(x + 6, y + h*0.4, w - 12, h*0.6);
    ctx.fillStyle = '#000';
    ctx.fillRect(x + 10, y + h*0.55, 3, 3);
    ctx.fillRect(x + 17, y + h*0.55, 3, 3);
  } else if (pu.kind === 'star') {
    const cx = x + w/2, cy = y + h/2;
    const rot = Date.now() / 200;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(rot);
    ctx.fillStyle = '#FFD700';
    ctx.beginPath();
    for (let i = 0; i < 5; i++) {
      const angle = (i * 4 * Math.PI / 5) - Math.PI/2;
      const px = Math.cos(angle) * w/2;
      const py = Math.sin(angle) * h/2;
      if (i === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#FFA500';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.restore();
  } else if (pu.kind === 'fireflower') {
    const cx = x + w/2, cy = y + h/2;
    ctx.fillStyle = '#4CAF50';
    ctx.fillRect(cx - 3, cy, 6, h/2);
    const colors = ['#E53935', '#FF9800', '#FFD700'];
    for (let i = 0; i < 6; i++) {
      const a = (i / 6) * Math.PI * 2 + Date.now() / 500;
      ctx.fillStyle = colors[i % 3];
      ctx.beginPath();
      ctx.arc(cx + Math.cos(a) * 12, cy + Math.sin(a) * 12, 7, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.fillStyle = '#FFEB3B';
    ctx.beginPath();
    ctx.arc(cx, cy, 8, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawFlag() {
  const f = world.flag;
  ctx.fillStyle = '#7a5a10';
  ctx.fillRect(f.x, f.y, f.w, f.h);
  ctx.fillStyle = '#999';
  ctx.fillRect(f.x + 2, f.y, 4, f.h);
  ctx.fillStyle = '#FFD700';
  ctx.beginPath();
  ctx.arc(f.x + 8, f.y - 4, 10, 0, Math.PI * 2);
  ctx.fill();
  const wave = Math.sin(Date.now() / 200) * 4;
  ctx.fillStyle = '#E53935';
  ctx.beginPath();
  ctx.moveTo(f.x + f.w, f.y + 30);
  ctx.lineTo(f.x + f.w + 80, f.y + 50 + wave);
  ctx.lineTo(f.x + f.w + 80, f.y + 110 + wave);
  ctx.lineTo(f.x + f.w, f.y + 130);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = '#FFD700';
  ctx.font = '30px Arial';
  ctx.textAlign = 'center';
  ctx.fillText('★', f.x + f.w + 40, f.y + 95 + wave);
}

function drawPlayer() {
  if (player.invincible > 0 && !player.hasFireFlower && Math.floor(player.invincible / 4) % 2 === 0) return;
  if (player.hasFireFlower && player.invincible > 0 && Math.floor(player.invincible / 4) % 2 === 0) return;

  const x = player.x, y = player.y, w = player.w, h = player.h;
  const capColor = player.hasFireFlower ? '#fff' : '#E53935';
  const overallColor = player.hasFireFlower ? '#E53935' : '#1976D2';

  ctx.fillStyle = capColor;
  ctx.fillRect(x + 2, y, w - 4, 8);
  ctx.fillRect(x + w - 10, y, 10, 5);
  ctx.fillStyle = '#FFCC99';
  ctx.fillRect(x + 4, y + 8, w - 8, 12);
  ctx.fillStyle = '#000';
  const eyeX = player.facing > 0 ? x + w - 12 : x + 8;
  ctx.fillRect(eyeX, y + 12, 3, 3);
  ctx.fillStyle = '#5C2E0E';
  ctx.fillRect(x + 6, y + 18, w - 12, 2);
  ctx.fillStyle = overallColor;
  ctx.fillRect(x + 2, y + 20, w - 4, h - 32);
  ctx.fillStyle = '#FFD700';
  ctx.fillRect(x + w/2 - 5, y + 24, 3, 3);
  ctx.fillRect(x + w/2 + 2, y + 24, 3, 3);
  ctx.fillStyle = capColor;
  if (player.onGround && Math.abs(player.vx) < 0.5) {
    ctx.fillRect(x - 2, y + 22, 5, 12);
    ctx.fillRect(x + w - 3, y + 22, 5, 12);
  } else {
    const swing = Math.sin(player.walkAnim) * 4;
    ctx.fillRect(x - 2, y + 22 + swing, 5, 12);
    ctx.fillRect(x + w - 3, y + 22 - swing, 5, 12);
  }
  ctx.fillStyle = '#5C2E0E';
  if (player.onGround && Math.abs(player.vx) > 0.5) {
    const swing = Math.sin(player.walkAnim) * 3;
    ctx.fillRect(x + 1, y + h - 8 + swing, w/2 - 2, 8);
    ctx.fillRect(x + w/2, y + h - 8 - swing, w/2 - 2, 8);
  } else {
    ctx.fillRect(x + 1, y + h - 8, w/2 - 2, 8);
    ctx.fillRect(x + w/2, y + h - 8, w/2 - 2, 8);
  }
}

function drawHUD(theme) {
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(0, 0, W, 50);

  ctx.fillStyle = '#fff';
  ctx.font = 'bold 20px Arial';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.fillText('⭐ ' + score, 20, 26);

  ctx.textAlign = 'center';
  ctx.fillStyle = '#FFD700';
  ctx.fillText('🪙 ' + coins, W/2 - 100, 26);

  ctx.fillStyle = '#fff';
  ctx.fillText('❤️ ' + lives, W/2 + 30, 26);

  ctx.textAlign = 'right';
  ctx.fillStyle = levelTime < 60 ? '#E53935' : '#fff';
  ctx.fillText('⏱ ' + Math.floor(levelTime / 60), W - 20, 26);

  if (world && world.flag) {
    const prog = Math.max(0, Math.min(1, player.x / world.flag.x));
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.fillRect(20, H - 20, W - 40, 10);
    ctx.fillStyle = '#4CAF50';
    ctx.fillRect(20, H - 20, (W - 40) * prog, 10);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 11px Arial';
    ctx.textAlign = 'center';
    ctx.fillText('🏃 ' + Math.round(prog * 100) + '%', W/2, H - 13);
  }
}

// ==================== МЫШЬ / ТАП ====================
let mouseX = null, mouseY = null;
canvas.addEventListener('mousemove', e => {
  const r = canvas.getBoundingClientRect();
  mouseX = (e.clientX - r.left) * (W / r.width);
  mouseY = (e.clientY - r.top) * (H / r.height);
});
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  const r = canvas.getBoundingClientRect();
  mouseX = (e.touches[0].clientX - r.left) * (W / r.width);
  mouseY = (e.touches[0].clientY - r.top) * (H / r.height);
  handleTap(mouseX, mouseY);
}, { passive: false });
canvas.addEventListener('click', e => {
  const r = canvas.getBoundingClientRect();
  mouseX = (e.clientX - r.left) * (W / r.width);
  mouseY = (e.clientY - r.top) * (H / r.height);
  handleTap(mouseX, mouseY);
});

function handleTap(x, y) {
  if (gameState === 'title') {
    gameState = 'levelselect';
    sfx.levelSelect();
  } else if (gameState === 'levelselect') {
    if (x > W/2 - 250 && x < W/2 + 250 && y > 140 && y < 420) {
      lives = 3; score = 0; coins = 0;
      loadLevel(currentLevelIndex);
      sfx.levelSelect();
    }
    if (x < 100 && y > H/2 - 60 && y < H/2 + 60) {
      currentLevelIndex = (currentLevelIndex - 1 + LEVELS.length) % LEVELS.length;
      sfx.levelSelect();
    }
    if (x > W - 100 && y > H/2 - 60 && y < H/2 + 60) {
      currentLevelIndex = (currentLevelIndex + 1) % LEVELS.length;
      sfx.levelSelect();
    }
  } else if (gameState === 'gameover') {
    gameState = 'title';
    timer = 0;
  }
}

// ==================== ЦИКЛ ====================
world = {
  platforms: [], blocks: [], coinsList: [], enemies: [],
  powerups: [], flag: null, width: 100, height: 600,
  timeLimit: 300, theme: 'day', name: ''
};

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>
